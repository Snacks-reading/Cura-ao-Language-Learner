<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Curacao Coach">
  <meta name="theme-color" content="#06142f">
  <title>Curacao Luxury Conversational Coach</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>Curacao Luxury Conversational Coach</h1>
      <p>Native-audio ready lesson coach with auto-advance, repeat, next, previous, slow mode, and phonetic fallback.</p>
      <button class="unlock" id="unlockBtn">Start + Unlock Audio</button>
      <div class="status" id="status">Audio status: not started.</div>
      <div class="speedBox">
        <div class="speedTitle">Audio Speed</div>
        <div class="seg">
          <button id="spSlow" class="active" onclick="setMode('slow')">Slow</button>
          <button id="spNormal" onclick="setMode('normal')">Normal</button>
          <button id="spLocal" onclick="setMode('local')">Local</button>
        </div>
      </div>
    </section>
    <nav class="tabs" id="tabs"></nav>
    <section id="coach" class="section active"></section>
    <section id="lessons" class="section"></section>
    <section id="phrasebook" class="section"></section>
    <section id="quiz" class="section"></section>
    <section id="native" class="section"></section>
    <div class="footer">Real native MP3s in /audio/ will play first. Synthetic phonetic speech is fallback only.</div>
  </main>
  <script src="app2.js?v=1"></script>
</body>
</html>
