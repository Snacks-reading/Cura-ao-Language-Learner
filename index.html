<html lang="en">

  <style>
    :root{--bg:#06142f;--panel:#132b56;--panel2:#1e3b70;--text:#fff;--muted:#c9d7f4;--gold:#ffd76b;--pink:#ff84bb;--aqua:#7df4ff;--green:#7ff0a4;--danger:#ff8f8f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(circle at 20% 10%,#3560b2 0,#102c5e 30%,#06142f 70%);color:var(--text)}body{padding:env(safe-area-inset-top) 14px calc(22px + env(safe-area-inset-bottom));}.app{max-width:920px;margin:0 auto}.hero{text-align:center;padding:22px 8px 12px}.hero h1{font-size:clamp(30px,8vw,58px);line-height:1.02;margin:10px 0 8px;letter-spacing:-.04em}.hero p{font-size:clamp(16px,4.3vw,22px);color:var(--muted);line-height:1.35;margin:0 auto;max-width:720px}.unlock{width:100%;border:0;border-radius:999px;padding:22px 18px;margin:18px 0 12px;font-size:clamp(22px,6vw,34px);font-weight:900;color:#171329;background:linear-gradient(100deg,#ffd76b,#ff84bb);box-shadow:0 18px 34px rgba(0,0,0,.35)}.status{font-size:18px;text-align:center;color:var(--muted);min-height:28px}.tabs{display:flex;gap:10px;overflow:auto;padding:14px 2px 18px;position:sticky;top:0;background:linear-gradient(180deg,rgba(6,20,47,.98),rgba(6,20,47,.82));backdrop-filter:blur(10px);z-index:5}.tab{flex:0 0 auto;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:white;border-radius:999px;padding:13px 18px;font-size:17px;font-weight:800}.tab.active{color:#071832;background:linear-gradient(100deg,#7df4ff,#d6b6ff);border-color:transparent}.section{display:none}.section.active{display:block}.card{background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.18);border-radius:28px;padding:20px;margin:0 0 16px;box-shadow:0 18px 34px rgba(0,0,0,.22)}.card h2{font-size:clamp(28px,7vw,44px);line-height:1.08;margin:0 0 10px}.card h3{font-size:24px;margin:0 0 8px;color:var(--gold)}.grid{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}.scenario-grid{grid-template-columns:repeat(3,1fr)}}.phrase{background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:16px;margin:12px 0}.pap{font-size:29px;font-weight:900;line-height:1.12}.eng{font-size:20px;color:var(--muted);line-height:1.25;margin-top:6px}.note{font-size:16px;color:#e7eefc;margin-top:8px;line-height:1.35}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.btn{border:0;border-radius:18px;padding:13px 15px;font-size:18px;font-weight:850;color:#071832;background:linear-gradient(100deg,#ffd76b,#ffbd67);box-shadow:0 10px 20px rgba(0,0,0,.22)}.btn.secondary{background:linear-gradient(100deg,#7df4ff,#b5f6ff)}.btn.pink{background:linear-gradient(100deg,#ff84bb,#d6b6ff)}.btn.green{background:linear-gradient(100deg,#7ff0a4,#d3ffd8)}.scenario{min-height:160px;display:flex;flex-direction:column;justify-content:space-between}.scenario-title{font-size:25px;font-weight:900}.scenario small{color:var(--muted);font-size:16px;line-height:1.25}.search{width:100%;padding:18px;border-radius:22px;border:2px solid rgba(255,255,255,.18);background:rgba(0,0,0,.22);color:white;font-size:19px;margin:0 0 14px}.progress{height:14px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;margin:12px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#7df4ff,#ffd76b,#ff84bb);transition:width .3s}.quizChoices{display:grid;gap:10px}.choice{border:2px solid rgba(255,255,255,.16);border-radius:18px;background:rgba(255,255,255,.08);color:white;text-align:left;padding:15px;font-size:18px}.choice.correct{background:rgba(127,240,164,.3);border-color:#7ff0a4}.choice.wrong{background:rgba(255,143,143,.22);border-color:#ff8f8f}.footer{color:var(--muted);font-size:14px;text-align:center;padding:18px}.pill{display:inline-block;border-radius:999px;background:rgba(255,255,255,.11);padding:8px 11px;margin:4px;color:#dce7ff;font-weight:700}.hidden{display:none!important}.big{font-size:22px;line-height:1.35}.warn{background:rgba(255,215,107,.12);border-color:rgba(255,215,107,.35)}</style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>📱 Curaçao Luxury Conversational Coach</h1>
      <p>Tap once, unlock audio, then practice real trip conversations for Curaçao: airport, hotel, taxi, restaurants, drinks, beaches, birthday, and emergencies.</p>
      <button class="unlock" id="unlockBtn">▶ Start + Unlock Audio</button>
      <div class="status" id="status">Audio status: not started.</div>
    </section>
    <nav class="tabs" id="tabs"></nav>
    <section id="coach" class="section active"></section>
    <section id="lessons" class="section"></section>
    <section id="phrasebook" class="section"></section>
    <section id="quiz" class="section"></section>
    <section id="install" class="section"></section>
    <div class="footer">Built for iPhone/iPad Safari and GitHub Pages. Audio requires one tap first.</div>
  </main>
<script>
'use strict';
const tabs=[['coach','Coach'],['lessons','40 Lessons'],['phrasebook','Phrasebook'],['quiz','Quiz'],['install','Install']];
const phrases=[
{cat:'Start Here',pap:'Bon dia.',eng:'Good morning.',note:'Use this everywhere in the morning.'},{cat:'Start Here',pap:'Kon ta bai?',eng:'How are you?',note:'Friendly greeting.'},{cat:'Start Here',pap:'Mi ta bon.',eng:'I am good.',note:'Simple response.'},{cat:'Polite',pap:'Por fabor.',eng:'Please.'},{cat:'Polite',pap:'Danki.',eng:'Thank you.'},{cat:'Polite',pap:'Di nada.',eng:"You're welcome."},{cat:'Polite',pap:'Mi no ta komprendé.',eng:"I don't understand."},{cat:'Polite',pap:'Bo por ripití?',eng:'Can you repeat?'},

{cat:'Taxi',pap:'Kuantu e ta kustá?',eng:'How much does it cost?'},{cat:'Taxi',pap:'Llevami na hotel.',eng:'Take me to the hotel.'},{cat:'Taxi',pap:'Mi ke bai Playa Kenepa.',eng:'I want to go to Kenepa Beach.'},{cat:'Taxi',pap:'Direito.',eng:'Straight.'},{cat:'Taxi',pap:'Na man drechi.',eng:'Right.'},{cat:'Taxi',pap:'Na man robes.',eng:'Left.'},

{cat:'Restaurant',pap:'Mi ke pidi...',eng:'I want to order...'},{cat:'Restaurant',pap:'Menu, por fabor.',eng:'Menu, please.'},{cat:'Restaurant',pap:'Bon provecho.',eng:'Enjoy your meal.'},{cat:'Restaurant',pap:'Mi ke un mesa pa kuater adulto i dos mucha.',eng:'I would like a table for four adults and two children.'},{cat:'Restaurant',pap:'Nos tin un reservashon.',eng:'We have a reservation.'},{cat:'Restaurant',pap:'Kiko bo ta rekomendá?',eng:'What do you recommend?'},{cat:'Restaurant',pap:'La cuenta, por fabor.',eng:'The bill, please.'},
{cat:'Drinks',pap:'Mi ke un Hugo Spritz ku hopi mint.',eng:'I would like a Hugo Spritz with lots of mint.'},{cat:'Drinks',pap:'Mi ke un French 79, por fabor.',eng:'I would like a French 79, please.'},{cat:'Drinks',pap:'Bo tin Caymus?',eng:'Do you have Caymus?'},{cat:'Drinks',pap:'Bo tin Woodford Double Oaked?',eng:'Do you have Woodford Double Oaked?'},{cat:'Drinks',pap:'Mi ke un martini di Tito’s, straight up, sin vermouth, sin jugo di olivo, ku olivo yená ku keshi bleu.',eng:"I want a Tito's martini, straight up, no vermouth, no olive juice, with blue-cheese stuffed olives."},
{cat:'Beach',pap:'Silla di playa.',eng:'Beach chair.'},{cat:'Beach',pap:'Sombré.',eng:'Umbrella.'},{cat:'Beach',pap:'Snorkel.',eng:'Snorkel.'},{cat:'Beach',pap:'Nos tin un les di snorkel na Playa Piskado.',eng:'We have a snorkeling lesson at Playa Piskado.'},{cat:'Beach',pap:'Nos tin les di mermaid na dies or di mainta.',eng:'We have mermaid lessons at 10 in the morning.'},{cat:'Beach',pap:'Sol ta fuerte.',eng:'The sun is strong.'},{cat:'Beach',pap:'Mi a kema ku sol.',eng:'I got sunburned.'},
{cat:'Tours',pap:'Tour di barku.',eng:'Boat tour.'},{cat:'Tours',pap:'Mi ke reservá.',eng:'I want to book.'},{cat:'Tours',pap:'Nos ta tuma potret di famia na Director’s Beach.',eng:"We are taking family photos at Director's Beach."},{cat:'Tours',pap:'Nos ke mira muralnan lokal.',eng:'We want to see local murals.'},
{cat:'Car Rental',pap:'Hür auto.',eng:'Rent a car.'},{cat:'Car Rental',pap:'Bo tin algu mas bunita?',eng:'Do you have anything nicer?'},{cat:'Car Rental',pap:'Bo tin algu mas grandi?',eng:'Do you have anything bigger?'},{cat:'Car Rental',pap:'Unda ta e gasolinera mas serka?',eng:'Where is the nearest gas station?'},
{cat:'Birthday',pap:'Nos ta selebrá cumpleaño di mi yiu Riley ku ta bira 11.',eng:"We are celebrating my daughter Riley's 11th birthday."},{cat:'Birthday',pap:'Nos ta selebrá cumpleaño di mi sobrina Harper ku ta bira 10.',eng:"We are celebrating my niece Harper's 10th birthday."},{cat:'Birthday',pap:'Felis cumpleaño, Ry Ry.',eng:'Happy birthday, Ry Ry.'},{cat:'Birthday',pap:'E ta bira diesun aña.',eng:'She is turning eleven.'},{cat:'Birthday',pap:'Nos ke dekorashon den kamber.',eng:'We want decorations in the room.'},
{cat:'Social',pap:'Mi nomber ta...',eng:'My name is...'},{cat:'Social',pap:'Mi ta kontentu di konektá ku bo.',eng:'Nice to meet you.'},{cat:'Social',pap:'Mi ta pasa un bon tempu.',eng:"I'm having a good time."},{cat:'Social',pap:'Bo ta bunita.',eng:'You look beautiful.'},{cat:'Social',pap:'Bo ta gusta Kòrsou?',eng:'Do you like Curaçao?'},
{cat:'Emergency',pap:'Mi tin dolor.',eng:'I have pain.'},{cat:'Emergency',pap:'Mi mester un dòkter.',eng:'I need a doctor.'},{cat:'Emergency',pap:'Mi a pèrdè mi pasaporte.',eng:'I lost my passport.'},{cat:'Emergency',pap:'Mi ke reportá un robo.',eng:'I want to report a theft.'},{cat:'Emergency',pap:'Mi kamber no tin awa.',eng:'My room has no water.'},{cat:'Emergency',pap:'Mi ta atrasá.',eng:"I'm running late."},{cat:'Emergency',pap:'Yama ambulans, por fabor.',eng:'Call an ambulance, please.'},
{cat:'Dutch',pap:'Goedemorgen.',eng:'Good morning.'},{cat:'Dutch',pap:'Dank u.',eng:'Thank you.'},{cat:'Dutch',pap:'Alstublieft.',eng:'Please.'},{cat:'Dutch',pap:'Waar is de uitgang?',eng:'Where is the exit?'},{cat:'Dutch',pap:'Reservering.',eng:'Reservation.'},{cat:'Dutch',pap:'Waar is het restaurant?',eng:'Where is the restaurant?'},{cat:'Dutch',pap:'Bel de politie.',eng:'Call the police.'},{cat:'Dutch',pap:'Ik ben gewond.',eng:'I am injured.'},
{cat:'Spanish',pap:'Buenos días.',eng:'Good morning.'},{cat:'Spanish',pap:'Por favor.',eng:'Please.'},{cat:'Spanish',pap:'Gracias.',eng:'Thank you.'},{cat:'Spanish',pap:'¿Dónde está...?',eng:'Where is...?'},{cat:'Spanish',pap:'¿Qué recomienda?',eng:'What do you recommend?'},{cat:'Spanish',pap:'¡Ayuda!',eng:'Help!'},{cat:'Spanish',pap:'Llama a una ambulancia.',eng:'Call an ambulance.'}
];
const lessons=[
['Greetings & First Contact',['Bon dia.','Bon tardi.','Bon nochi.','Kon ta bai?','Mi ta bon.']],['Politeness & Survival',['Por fabor.','Danki.','Di nada.','Mi no ta komprendé.','Bo por ripití?']],['Numbers & Travel Words',['Un. Dos. Tres. Kuater. Sinku.','Aeropuerto. Taxi. Playa. Hotel. Mapa.']],['Airport Arrival',['Mi tin un reservashon.','Unda ta e salida?','Mi maleta a pèrdè.','Mi ta buska un taxi.']],['Taxi & Directions',['Kuantu e ta kustá?','Llevami na hotel.','Mi ke bai Playa Kenepa.','Direito. Na man drechi. Na man robes.']],['Basic Dutch',['Goedemorgen.','Dank u.','Alstublieft.','Waar is de uitgang?']],['Basic Spanish',['Buenos días.','Por favor.','Gracias.','La cuenta.','¿Dónde está?']],['Review 1',['Bon dia.','Por fabor.','Mi tin un reservashon.','Kuantu e ta kustá?']],['Hotel Check-In',['Mi nomber ta.','Mi ke un kamber ku dos kama.','Mi a papia ku Stephanie di e Concierge team.','Mi a papia ku Tai Rock tambe.']],['Asking for Help',['Bo por yuda mi?','Mi tin un problema.','Mi no ta haña e lugá.']],['Ordering Food',['Mi ke pidi.','Menu, por fabor.']],['Drinks',['Koffie. Te. Jus di fruta.','Mi ke un martini di Tito’s, straight up, sin vermouth, sin jugo di olivo, ku olivo yená ku keshi bleu.']],['Dutch Restaurants',['Kamer. Reservering. Ontbijt.','Waar is het restaurant?']],['Spanish Restaurants',['El menú. La cuenta. Agua.','¿Qué recomienda?']],['Directions',['Unda ta?','Serka. Leu. Direito. Na man drechi. Na man robes.']],['Simulation',['Bo tin pasaporte?','Unda bo ke bai?']],['Local Foods',['Keshi yena.','Stoba.','Pastechi.']],['Allergies',['Mi tin alergia.','No por kome.']],['Shopping',['Mi ke mira e otro.','Mi ta gusta esaki.']],['Bargaining',['Por baha un tiki?']],['Beaches',['Silla di playa.','Sombré.','Snorkel.','Nos tin un les di snorkel na Playa Piskado.']],['Tours',['Tour di barku.','Mi ke reservá.']],['Transportation',['Hür auto.','Parada di bus.','Bo tin algu mas bunita?','Bo tin algu mas grandi?','Unda ta e gasolinera mas serka?']],['Review 2',['Keshi yena.','Sombré.','Tour di barku.']],['Meeting People',['Mi nomber ta.','Mi ta kontentu di konektá ku bo.','Nos ta selebrá cumpleaño di mi yiu Riley ku ta bira 11.','Nos ta selebrá cumpleaño di mi sobrina Harper ku ta bira 10.']],['Talking About Yourself',['Mi ta traha komo.','Mi gusta.']],['Etiquette',['Bon provecho.','Permiso.']],['Compliments',['Bo ta bunita.','Mi ta pasa un bon tempu.']],['Dutch Social',['Hoe gaat het?','Gezellig.']],['Spanish Social',['¿Cómo estás?','Mucho gusto.']],['Fast Speech',['Kontabai.','Undabobai.']],['Social Simulation',['Bo ta gusta Kòrsou?']],['Medical',['Mi tin dolor.','Mi mester un dòkter.']],['Safety',['Mi a pèrdè mi pasaporte.','Mi ke reportá un robo.']],['Problems',['Mi kamber no tin awa.','Mi ta atrasá.']],['Weather',['Sol ta fuerte.','Mi a kema ku sol.']],['Dutch Emergencies',['Bel de politie.','Ik ben gewond.']],['Spanish Emergencies',['¡Ayuda!','Llama a una ambulancia.']],['Full Simulation',['Mi a papia ku Stephanie di e Concierge team.','Mi a papia ku Tai Rock tambe.','Mi ke un martini di Tito’s, straight up, sin vermouth, sin jugo di olivo, ku olivo yená ku keshi bleu.']],['Final Mastery',['Bo por yuda mi.','Mi ta pasa un bon tempu.','Mi mester un dòkter.','Felicidades! Bo ta kla pa papia ku konfiansa na Kòrsou.']]
];
const scenarios=[
{t:'✈️ Airport Arrival',d:'Immigration, baggage, taxi stand',cats:['Airport','Polite','Taxi']},{t:'🏨 Rif Mangrove & Concierge',d:'Check-in, help, room issues, concierge names',cats:['Hotel','Polite','Emergency']},{t:'🍹 Drinks & Dining',d:'Hugo Spritz, Caymus, bourbon, martini, dinner',cats:['Restaurant','Drinks','Polite']},{t:'🚖 Taxis & Directions',d:'Costs, routes, beaches, right/left/straight',cats:['Taxi','Car Rental']},{t:'🏖️ Beaches & Excursions',d:'Snorkeling, mermaid lessons, photos, tours',cats:['Beach','Tours']},{t:'🎂 Birthday Mode',d:'Riley, Harper, decorations, celebration phrases',cats:['Birthday','Social']},{t:'🚨 Emergency Calm Mode',d:'Doctor, passport, police, room problems',cats:['Emergency','Dutch','Spanish']},{t:'🗣️ Speak Like a Local',d:'Core Papiamentu plus Dutch and Spanish survival phrases',cats:['Start Here','Social','Dutch','Spanish']}
];
let unlocked=false, rate=0.82, currentQuiz=null, score=0, done=Number(localStorage.getItem('curacaoDone')||0);
function byId(id){return document.getElementById(id)}
function speak(text, slow=false){
  if(!('speechSynthesis' in window)){byId('status').textContent='This browser does not support speech audio.';return}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/\s+/g,' '));
  u.rate=slow?0.58:rate; u.pitch=1; u.volume=1;
  const voices=window.speechSynthesis.getVoices();
  const pref=voices.find(v=>/Samantha|Ava|Allison|Susan|Victoria|Karen|Moira|Tessa|Zoe|Nicky|Aria/i.test(v.name))||voices.find(v=>/en-US|en_US|English/i.test(v.lang))||voices[0];
  if(pref)u.voice=pref;
  u.onstart=()=>{byId('status').textContent='Playing audio…'};
  u.onend=()=>{byId('status').textContent='Audio ready. Tap any phrase.'};
  u.onerror=()=>{byId('status').textContent='Audio blocked. Tap Start + Unlock Audio again.'};
  window.speechSynthesis.speak(u);
}
function unlock(){unlocked=true; speak('Audio is unlocked. Bon dia. Welcome to your Curaçao conversational coach.', false); byId('status').textContent='Audio unlocked. Tap any Play button.';}
function phraseCard(p){return `<div class="phrase"><div class="pap">${p.pap}</div><div class="eng">${p.eng}</div>${p.note?`<div class="note">${p.note}</div>`:''}<div class="row"><button class="btn" onclick="speak(${JSON.stringify(p.pap)})">🔊 Play</button><button class="btn secondary" onclick="speak(${JSON.stringify(p.pap)},true)">🐢 Slow</button><button class="btn pink" onclick="speak(${JSON.stringify(p.pap+'. '+p.eng)})">🎧 Phrase + meaning</button></div></div>`}
function renderTabs(){byId('tabs').innerHTML=tabs.map(([id,label])=>`<button class="tab ${id==='coach'?'active':''}" onclick="show('${id}',this)">${label}</button>`).join('')}
function show(id,el){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));byId(id).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));if(el)el.classList.add('active'); if(id==='quiz')newQuiz();}
function renderCoach(){byId('coach').innerHTML=`<div class="card"><h2>Choose a real trip conversation</h2><p class="big">This is luxury coach mode: airport, concierge, restaurants, birthday, activities, and emergency calm mode.</p><div class="progress"><div class="bar" style="width:${Math.min(100,done)}%"></div></div><div><span class="pill">Progress ${done}%</span><span class="pill">${phrases.length} phrases</span><span class="pill">40 lessons</span></div></div><div class="grid scenario-grid">${scenarios.map((s,i)=>`<div class="card scenario"><div><div class="scenario-title">${s.t}</div><small>${s.d}</small></div><div class="row"><button class="btn" onclick="openScenario(${i})">Open</button><button class="btn secondary" onclick="playScenario(${i})">🔊 Coach</button></div></div>`).join('')}</div><div id="scenarioDetail"></div>`}
function openScenario(i){const s=scenarios[i]; const list=phrases.filter(p=>s.cats.includes(p.cat)); byId('scenarioDetail').innerHTML=`<div class="card"><h2>${s.t}</h2><p class="big">Practice these out loud. Tap slow first, then normal.</p>${list.map(phraseCard).join('')}</div>`; location.hash='scenarioDetail'}
function playScenario(i){const s=scenarios[i]; const list=phrases.filter(p=>s.cats.includes(p.cat)).slice(0,8); speak(`${s.t}. Listen and repeat. `+list.map(p=>`${p.pap}. ${p.eng}.`).join(' '));}
function renderLessons(){byId('lessons').innerHTML=`<div class="card"><h2>40 Lesson Course</h2><p class="big">Tap a lesson to hear a guided mini-session.</p></div><div class="grid">${lessons.map((l,i)=>`<div class="card"><h3>Lesson ${i+1}: ${l[0]}</h3><div class="note">${l[1].slice(0,3).join(' · ')}</div><div class="row"><button class="btn" onclick="speak(${JSON.stringify('Lesson '+(i+1)+'. '+l[0]+'. Listen and repeat. '+l[1].join('. '))})">🔊 Play lesson</button><button class="btn secondary" onclick="markDone()">✓ Done</button></div></div>`).join('')}</div>`}
function renderPhrasebook(filter=''){const q=filter.toLowerCase();const list=phrases.filter(p=>(p.cat+p.pap+p.eng).toLowerCase().includes(q)); byId('phrasebook').innerHTML=`<div class="card"><h2>Searchable Phrasebook</h2><input class="search" placeholder="Search taxi, drink, birthday, doctor…" oninput="renderPhrasebook(this.value)" value="${filter.replace(/"/g,'&quot;')}"><p class="big">${list.length} matching phrases.</p></div>${list.map(phraseCard).join('')}`}
function markDone(){done=Math.min(100,done+3); localStorage.setItem('curacaoDone',done); renderCoach(); byId('status').textContent='Progress saved.'}
function newQuiz(){const p=phrases[Math.floor(Math.random()*phrases.length)]; const wrong=phrases.filter(x=>x!==p).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.eng); const opts=[p.eng,...wrong].sort(()=>Math.random()-.5); currentQuiz=p; byId('quiz').innerHTML=`<div class="card"><h2>Quiz Mode</h2><p class="big">What does this mean?</p><div class="phrase"><div class="pap">${p.pap}</div><div class="row"><button class="btn" onclick="speak(${JSON.stringify(p.pap)})">🔊 Hear it</button><button class="btn secondary" onclick="speak(${JSON.stringify(p.pap)},true)">🐢 Slow</button></div></div><div class="quizChoices">${opts.map(o=>`<button class="choice" onclick="answer(this,${JSON.stringify(o)})">${o}</button>`).join('')}</div><p class="big">Score: ${score}</p></div>`}
function answer(el,o){if(o===currentQuiz.eng){el.classList.add('correct');score++;speak('Correct. '+currentQuiz.pap+'. '+currentQuiz.eng);setTimeout(newQuiz,1200)}else{el.classList.add('wrong');speak('Not quite. Try again.')}}
function renderInstall(){byId('install').innerHTML=`<div class="card warn"><h2>Install on iPhone/iPad</h2><p class="big">Open this GitHub Pages link in Safari. Tap the Share icon, then <b>Add to Home Screen</b>. After that it opens like an app.</p><p class="big">Audio works only after tapping <b>Start + Unlock Audio</b>. This is an Apple iPhone browser rule.</p></div><div class="card"><h3>Audio Test</h3>${phraseCard({pap:'Bon dia. Kon ta bai? Mi ta bon.',eng:'Good morning. How are you? I am good.',note:'If this plays, the app is working.'})}</div>`}
renderTabs();renderCoach();renderLessons();renderPhrasebook();renderInstall();byId('unlockBtn').addEventListener('click',unlock);if('speechSynthesis' in window){window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();}
</script>
</body>
</html>
